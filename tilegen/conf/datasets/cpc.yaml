name: cpc
version: v1.0
description: CPC Global Daily Temperature V1.0 — Tmax/Tmin globales diarios, 0.5°, 1979–presente (NOAA PSL)
source: cpc_psl
temporal: daily
start: 1979-01-01
lag_days: 3           # el archivo del año en curso se actualiza con ~2 días de atraso

# El archivo anual entero (~63 MB comprimido), no OPeNDAP: desde el 12-oct-2026
# el THREDDS de PSL le contesta 429 a este server aunque sea un solo pedido.
# Se baja una vez por corrida y cada escena recorta en local.
base_url: https://downloads.psl.noaa.gov/Datasets/cpc_global_temp

variables:
  tmax:
    source_file: tmax
    units: degC
  tmin:
    source_file: tmin
    units: degC
